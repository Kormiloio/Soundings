name: Release & Attest Provenance

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    name: Build & Verify (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag_info.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bare semantic tag on main
        id: tag_info
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$VERSION' must be a bare x.y.z version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$VERSION' does not point at a commit on main."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verification gates
        run: |
          npm run check
          npm run audit:runtime
          npm audit --omit=dev
          npm run spec:validate
          git diff --check

      - name: Stage release assets
        env:
          VERSION: ${{ steps.tag_info.outputs.version }}
        run: |
          node scripts/prepare-release.mjs --tag "$VERSION"
          awk -v heading="## $VERSION" '
            index($0, "## ") == 1 { active = ($0 == heading || index($0, heading " ") == 1) }
            active { print }
          ' CHANGELOG.md > "release/$VERSION/RELEASE_NOTES.md"
          if ! [ -s "release/$VERSION/RELEASE_NOTES.md" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi
          (cd "release/$VERSION" && sha256sum main.js manifest.json styles.css)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/${{ steps.tag_info.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest & Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Refuse an existing release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Releases are immutable; publish a new patch version."
            exit 1
          fi
          sha256sum bundle/main.js bundle/manifest.json bundle/styles.css

      - name: Generate build artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bundle/main.js
            bundle/manifest.json
            bundle/styles.css

      - name: Publish immutable GitHub release
        run: |
          gh release create "$VERSION" \
            bundle/main.js \
            bundle/manifest.json \
            bundle/styles.css \
            --verify-tag \
            --title "Soundings $VERSION" \
            --notes-file bundle/RELEASE_NOTES.md
