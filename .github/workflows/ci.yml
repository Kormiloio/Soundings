name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Audit & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Typecheck
        run: npm run build

      - name: Type-aware Lint (Obsidian rules)
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Runtime Security & Community Audit
        run: npm run audit:runtime

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Validate OpenSpec Specifications
        run: npm run spec:validate

      - name: Git Diff Whitespace Check
        run: git diff --check
