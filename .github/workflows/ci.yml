name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Audit & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Typecheck
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Runtime Security & Community Audit
        run: npm run audit:runtime

      - name: Production Dependency Audit
        run: npm audit --production

      - name: Validate OpenSpec Specifications
        run: npm run spec:validate

      - name: Git Diff Whitespace Check
        run: git diff --check
